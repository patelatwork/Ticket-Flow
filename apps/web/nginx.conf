# Serves the SPA and proxies /api to the API, so the browser sees one origin
# (first-party refresh cookie, no CORS).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # The API scopes the refresh cookie to /auth; in the browser that path is /api/auth.
    # The admin cookie keeps its /admin path: it is for the Bull Board location below.
    proxy_cookie_path /auth /api/auth;
  }

  # Bull Board serves its UI and assets under /admin/queues; proxied without a prefix.
  location /admin/queues {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Server-Sent Events: no buffering, long-lived connection.
  location ~ ^/api/events/[^/]+/seats/stream$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
